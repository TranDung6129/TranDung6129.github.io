{{- /* Brand lockup (D5, owner choice C): the Mattioli vetch sprig as a CSS mask filled with the
       accent colour (static/images/brand-sprig.svg; cached, theme-aware), then the wordmark. */ -}}
{{- $compact := .compact | default false -}}
<span class="brand{{ if $compact }} brand-compact{{ end }}">
  <span class="brand-mark" aria-hidden="true"></span>
  {{- if not $compact }}<span class="brand-name">{{ site.Title }}</span>{{ end -}}
</span>
