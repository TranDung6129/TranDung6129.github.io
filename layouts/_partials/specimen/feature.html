<article class="feature">
  <figure class="feature-image {{ .variant }}">
    {{ if eq .variant "landscape" }}
      {{ partial "specimen/art-image.html" (dict "name" "epistemic_probability_v2" "widths" (slice 320 592) "width" 592 "height" 708 "sizes" "(max-width: 560px) 44vw, (max-width: 1150px) 44vw, 24vw" "alt" .alt) }}
    {{ else if eq .variant "architecture" }}
      {{ partial "specimen/art-image.html" (dict "name" "epistemic_decision_v2" "widths" (slice 400 775) "width" 775 "height" 574 "sizes" "(max-width: 560px) 44vw, (max-width: 1150px) 44vw, 24vw" "alt" .alt) }}
    {{ end }}
    <figcaption>{{ .figure }}</figcaption>
  </figure>
  <div class="feature-copy"><p class="kicker">{{ .category }}</p><h3>{{ .title }}</h3><p>{{ .description }}</p><span class="demo-link">An essay in progress <span aria-hidden="true">↗</span></span></div>
</article>
