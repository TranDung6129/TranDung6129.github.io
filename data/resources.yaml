  - bib: shoham2008
    topics: [khoa-hoc-may-tinh, kinh-te]
    why: { vi: "Tính toán cân bằng, trò chơi thế năng và độ phức tạp trong cùng một hệ ký hiệu.", en: "Computing equilibria, potential games and complexity in one consistent notation." }
    essays: [/kinh-te/game_theory_nash]
