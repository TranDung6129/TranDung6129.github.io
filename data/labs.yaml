# Interactive experiments that exist on the site (P3-05).
labs:
  - id: nash-explorer
    title:
      vi: "Khám phá cân bằng Nash 2×2"
      en: "2×2 Nash equilibrium explorer"
    description:
      vi: "Chỉnh ma trận lợi ích, chọn các trò chơi kinh điển (Song Tù, Đồng Xu Khớp…) và xem cân bằng thuần, cân bằng hỗn hợp và đường phản ứng tốt nhất thay đổi theo."
      en: "Edit the payoff matrix, load classic games (Prisoner's Dilemma, Matching Pennies…) and watch pure and mixed equilibria and best-response curves change."
    requires:
      vi: "Cần màn hình máy tính hoặc máy tính bảng xoay ngang; trên điện thoại hiển thị phần giải thích thay thế."
      en: "Needs a desktop or landscape tablet screen; phones show a text fallback."
    tech: "React · Recharts"
    related: /kinh-te/game_theory_nash
    anchor: "11-interactive-exploration"
