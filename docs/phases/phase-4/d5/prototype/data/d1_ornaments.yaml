# Ornament library (D5 prototype; replaces the D1 prototype line art once approved).
# Public-domain / CC0 engravings and woodcuts from Wikimedia Commons, verified 2026-11-24 from
# each file's Commons metadata. Every descriptive field below is copied from that metadata
# (file title, Artist, date, description); nothing is added from memory. Processing: the darkest ink is
# separated from the paper (illumination flattened, soft threshold) into an alpha mask; printed
# captions are blanked or cropped out; no other change to the drawing. Shown via CSS mask in
# the accent colour, so the line follows the theme. Pipeline: docs/phases/phase-4/d5/process.py
#
# Roles: branch (article headpiece, mirrored pair), toc (below the contents rail),
#        landscape (faint strip below the footer). Rotation as in D1 (md5 of the content path).
