# -------------------------------------------------------------------------------------
# Markup related configuration in Hugo
# See: https://gohugo.io/getting-started/configuration-markup/
# -------------------------------------------------------------------------------------

# Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
[highlight]
  ########## necessary configurations ##########
  # https://github.com/Lruihao/FixIt/issues/43
  codeFences = true
  lineNos = true
  lineNumbersInTable = true
  noClasses = false
  ########## necessary configurations ##########
  guessSyntax = true

# Goldmark is from Hugo 0.60 the default library used for Markdown
[goldmark]
  [goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
    # Inline extras: ~~del~~, ++ins++, ==mark==, ~sub~, ^sup^ (moved from the former root hugo.toml in P1-05)
    # https://gohugo.io/configuration/markup/#extras
    [goldmark.extensions.extras]
      [goldmark.extensions.extras.delete]
        enable = true
      [goldmark.extensions.extras.insert]
        enable = true
      [goldmark.extensions.extras.mark]
        enable = true
      [goldmark.extensions.extras.subscript]
        enable = true
      [goldmark.extensions.extras.superscript]
        enable = true
    # Pass TeX through untouched for MathJax (moved from the former root hugo.toml in P1-05)
    # https://gohugo.io/content-management/mathematics/
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        # D2: numbered environments pass through untouched (see layouts/_markup/render-passthrough.html).
        block = [['\[', '\]'], ['$$', '$$'], ['\begin{equation}', '\end{equation}'], ['\begin{align}', '\end{align}']]
        inline = [['\(', '\)'], ['$', '$']]
  [goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = "github"
    wrapStandAloneImageWithinParagraph = true
    [goldmark.parser.attribute]
      block = true
      title = true
  [goldmark.renderer]
    # By default, Goldmark ignores newlines within a paragraph. Set to true to render newlines as <br> elements.
    hardWraps = false
    # whether to use HTML tags directly in the document
    unsafe = true

# Table Of Contents settings
[tableOfContents]
  ordered = false
  startLevel = 2
  endLevel = 6

_merge = "shallow"